name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Code map is up to date
        run: python3 tools/gen_map.py --check
      - name: Test and build
        run: ./gradlew --no-daemon -PbuildNumber=${{ github.run_number }} :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyListsTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyListsTV-apk
          path: MyListsTV.apk
      - name: Version name from the run number (0.1.99, then 0.2.0; same rule as data/Version.kt)
        id: ver
        run: echo "name=0.$((1 + ${{ github.run_number }} / 100)).$((${{ github.run_number }} % 100))" >> "$GITHUB_OUTPUT"
      - name: Publish a release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: My Lists TV ${{ steps.ver.outputs.name }}
          prerelease: true
          files: MyListsTV.apk
