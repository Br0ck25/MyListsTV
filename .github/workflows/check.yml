name: Check pull request

# The same checks as a build, for a pull request: code map, tests and a debug APK. It publishes nothing, and its run numbers are its own,
# so a pull request never uses up a release version (see build.yml).
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Code map is up to date
        run: python3 tools/gen_map.py --check
      - name: Test and build
        run: ./gradlew --no-daemon -PbuildNumber=1 :app:testDebugUnitTest :app:assembleDebug
